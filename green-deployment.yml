---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-mysql-deployment
  labels:
    app: db
    author: intelliqit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      name: mysql-pod
      labels:
        app: db
    spec:
      containers:
        - name: mydb
          image: mysql:9
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: intelliqit
...
