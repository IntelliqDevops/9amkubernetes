---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  labels:
    author: intelliqit
spec:
  rules:
     - host: amazon.books.com
       http:
         paths:
           - path: /
             pathType: Prefix
             backend:
               service:
                 name: nginx-service
                 port:
                   number: 80
     - host: amazon.mobiles.com
       http:
         paths:
           - path: /
             pathType: Prefix
             backend:
               service:
                 name: tomcat-service
                 port:
                   number: 80
     - host: amazon.gifts.com
       http:
         paths:
           - path: /
             pathType: Prefix
             backend:
               service:
                 name: apache-service
                 port:
                   number: 80
...








